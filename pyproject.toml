[project]
name = "atlas-screening-data"
version = "0.1.0"
description = "Data acquisition tooling for the adverse media and sanctions screening platform."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "lxml>=5.0",
  "pyarrow>=15.0",
  "duckdb>=1.0",
  "trafilatura>=1.12",
  "lingua-language-detector>=2.0",
  "huggingface_hub>=0.24",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["data/scripts"]
testpaths = ["tests"]
