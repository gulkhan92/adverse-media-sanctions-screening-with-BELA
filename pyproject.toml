[project]
name = "atlas-screening-data"
version = "0.1.0"
description = "Data acquisition tooling for the adverse media and sanctions screening platform."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "lxml>=5.0",
  "pyarrow>=15.0",
  "duckdb>=1.0",
  "trafilatura>=1.12",
  "lingua-language-detector>=2.0",
  "huggingface_hub>=0.24",
  "tenacity>=8.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pandas>=2.2",
  "pandera>=0.20",
  "rapidfuzz>=3.9",
  "anyascii>=0.3",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "bandit>=1.7"]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.8",
  "pyotp>=2.9",
  "zxcvbn>=4.4",
  "valkey>=6.0",
  "qrcode>=7.4",
  "email-validator>=2.1",
  "psycopg-pool>=3.2",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "redis>=5.0",
  "weasyprint>=62",
  "networkx>=3.2",
  "statsmodels>=0.14",
  "numpy>=1.26",
]
nlp = ["scikit-learn>=1.4", "matplotlib>=3.8", "pysbd>=0.3"]
models = ["torch>=2.2", "transformers>=4.40", "sentencepiece>=0.2", "prometheus-client>=0.20"]

[tool.ruff]
line-length = 100
extend-exclude = ["services/nel/vendor"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.File",
  "atlas.api.deps.Authorized",
  "atlas.api.deps.AuthorizedPlatform",
]

[tool.ruff.lint.per-file-ignores]
# Report-building code with long format strings and nested expressions.
"apps/api/atlas/nlp/eval_analysis.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["data/scripts", "apps/api"]
testpaths = ["tests"]
