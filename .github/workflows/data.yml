name: data-tooling
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_ADMIN_URL: postgresql://atlas@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forbidden character check
        run: python3 scripts/check_forbidden_chars.py
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check data/scripts apps tests scripts
      - name: Tests
        run: pytest -q
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        run: pip install pip-audit && pip-audit
